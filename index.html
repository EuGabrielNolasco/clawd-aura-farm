<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Clicker em que o Clawd faz o six seven enquanto você farma aura.">
<title>Clawd Aura Farm</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#140f24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=VT323&display=swap">
</head>
<body>

<div class="stage" id="stage">
  <div class="bg67" aria-hidden="true">67</div>
  <canvas id="fx"></canvas>
  <div class="flash" id="flash"></div>

  <button id="mute" class="mute" type="button">🔊</button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="hud">
    <div class="label">Aura</div>
    <div class="count" id="count">0</div>
    <div class="rank">Nível: <b id="rank">NPC</b></div>
    <div class="mult"><span id="mult">×1 de nível</span> · <span id="rate">+0/s no automático</span></div>
    <div class="next" title="Progresso até o próximo nível"><i id="bar"></i></div>
    <div class="next-label" id="next"></div>
  </div>

  <div class="mascot-wrap" id="mascot" role="button" tabindex="0" aria-label="Clawd fazendo six seven. Clique para farmar aura.">
    <div class="spot"></div>
    <div class="halo"></div>
    <div class="ring"></div>
    <div class="clones" id="clones"></div>
    <span class="sixseven l">6</span>
    <span class="sixseven r">7</span>
    <svg class="mascot" id="clawd" viewBox="0 0 32 32" shape-rendering="crispEdges">
      <!-- asas (Ascendido) -->
      <g class="wings" fill="#f3ecff">
        <rect x="1" y="5" width="6" height="2"/><rect x="2" y="7" width="5" height="2"/><rect x="4" y="3" width="3" height="2"/>
        <rect x="25" y="5" width="6" height="2"/><rect x="25" y="7" width="5" height="2"/><rect x="25" y="3" width="3" height="2"/>
      </g>
      <g class="body-fill">
        <rect x="8" y="9" width="16" height="12"/>
        <rect x="9" y="21" width="2" height="4"/>
        <rect x="13" y="21" width="2" height="4"/>
        <rect x="17" y="21" width="2" height="4"/>
        <rect x="21" y="21" width="2" height="4"/>
      </g>
      <g class="arm-l">
        <rect class="body-fill" x="4" y="13" width="4" height="2"/>
        <rect x="2" y="11" width="3" height="2" fill="#ffd166"/>
      </g>
      <g class="arm-r">
        <rect class="body-fill" x="24" y="13" width="4" height="2"/>
        <rect x="27" y="11" width="3" height="2" fill="#ffd166"/>
        <!-- saco do ladrão (Coop Thief) -->
        <g class="sack">
          <rect x="27" y="13" width="3" height="1" fill="#6b4a2b"/>
          <rect x="26" y="14" width="5" height="4" fill="#a87b4f"/>
          <rect x="27" y="15" width="3" height="2" fill="#ffd166"/>
        </g>
      </g>
      <g fill="#140f24">
        <rect class="eye" x="11" y="12" width="2" height="3"/>
        <rect class="eye" x="19" y="12" width="2" height="3"/>
      </g>
      <!-- sobrancelhas bravas (Brabo) -->
      <g class="brows" fill="#140f24">
        <rect x="10" y="10" width="2" height="1"/><rect x="12" y="11" width="2" height="1"/>
        <rect x="18" y="11" width="2" height="1"/><rect x="20" y="10" width="2" height="1"/>
      </g>
      <!-- corrente de ouro (O Pai Tá On) -->
      <g class="chain" fill="#ffd166">
        <rect x="10" y="17" width="1" height="1"/><rect x="11" y="18" width="1" height="1"/><rect x="12" y="19" width="2" height="1"/>
        <rect x="18" y="19" width="2" height="1"/><rect x="20" y="18" width="1" height="1"/><rect x="21" y="17" width="1" height="1"/>
        <rect x="14" y="19" width="4" height="2" fill="#fff3c4"/>
      </g>
      <g class="shades" fill="#140f24">
        <rect x="9" y="12" width="6" height="3"/>
        <rect x="17" y="12" width="6" height="3"/>
        <rect x="15" y="12" width="2" height="1"/>
        <rect x="10" y="12" width="2" height="1" fill="#f3ecff"/>
        <rect x="18" y="12" width="2" height="1" fill="#f3ecff"/>
      </g>
      <!-- cérebro gigante (Mega Brain) -->
      <g class="brain">
        <rect x="10" y="5" width="12" height="4" fill="#ff8fb8"/>
        <rect x="11" y="4" width="4" height="1" fill="#ff8fb8"/><rect x="17" y="4" width="4" height="1" fill="#ff8fb8"/>
        <rect x="9" y="6" width="1" height="3" fill="#ff8fb8"/><rect x="22" y="6" width="1" height="3" fill="#ff8fb8"/>
        <rect x="13" y="5" width="1" height="2" fill="#d9578f"/><rect x="16" y="4" width="1" height="4" fill="#d9578f"/>
        <rect x="19" y="6" width="1" height="2" fill="#d9578f"/><rect x="11" y="7" width="2" height="1" fill="#d9578f"/>
        <rect class="synapse" x="12" y="6" width="1" height="1" fill="#6bffe0"/>
        <rect class="synapse" x="20" y="5" width="1" height="1" fill="#6bffe0"/>
        <rect class="synapse" x="17" y="7" width="1" height="1" fill="#6bffe0"/>
      </g>
      <!-- coroa (Lenda) -->
      <g class="crown" fill="#ffd166">
        <rect x="11" y="6" width="10" height="3"/>
        <rect x="11" y="4" width="2" height="2"/><rect x="15" y="3" width="2" height="3"/><rect x="19" y="4" width="2" height="2"/>
        <rect x="15" y="7" width="2" height="1" fill="#ff6b6b"/>
      </g>
      <rect x="8" y="21" width="16" height="1" fill="#a8553b"/>
    </svg>
    <div class="banner" id="banner"></div>
  </div>

  <div class="controls">
    <button id="farm" type="button">FARMAR AURA <span id="gain">+67</span></button>
    <button id="ranking-open" type="button" hidden>🏆 Ranking</button>
    <button id="shop-toggle" type="button" aria-controls="shop" aria-expanded="false">🛒 Loja</button>
    <a id="star" href="https://github.com/EuGabrielNolasco/clawd-aura-farm" target="_blank" rel="noopener">⭐ Dar estrela no GitHub</a>
    <button id="reset" type="button">zerar aura</button>
  </div>
  <div class="ladder" id="ladder"></div>

  <dialog class="ranking" id="ranking" aria-labelledby="ranking-title">
    <div class="shop-head"><h2 id="ranking-title">Ranking</h2><button id="ranking-close" type="button" aria-label="Fechar ranking">✕</button></div>
    <p class="my-rank" id="my-rank">Conectando…</p>
    <form id="name-form">
      <label for="name">Seu apelido</label>
      <div class="name-row">
        <input id="name" name="name" required minlength="3" maxlength="20" autocomplete="nickname"
               pattern="[A-Za-zÀ-ÖØ-öø-ÿ0-9 _.\-]{3,20}" title="De 3 a 20 letras, números, espaço, _ . ou -">
        <button type="submit">Salvar</button>
      </div>
      <p class="name-msg" id="name-msg" role="status"></p>
    </form>
    <ol class="top" id="top"></ol>
    <p class="net" id="net"></p>
  </dialog>

  <aside class="shop" id="shop" aria-label="Loja de upgrades">
    <div class="shop-head"><h2>Loja</h2><button id="shop-close" type="button" aria-label="Fechar loja">✕</button></div>
    <div class="shop-items" id="shop-items"></div>
  </aside>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
